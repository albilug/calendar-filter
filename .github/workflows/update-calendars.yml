name: Update Calendars

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unisr_calendar/**'
      - 'sync_calendars.py'
      - 'courses.py'
      - 'calendar_config.json'
      - 'requirements.txt'
      - '.github/workflows/update-calendars.yml'

permissions:
  contents: write

concurrency:
  group: update-calendars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify synchronization
        run: python -m unittest discover -s tests -q
      - name: Generate calendars
        run: python sync_calendars.py
      - name: Publish updated subscription files
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@github.com"
          git add calendars/ data/ shared_calendar.ics filtered_calendar.ics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update UniSR calendar subscriptions"
          git pull --rebase
          git push
